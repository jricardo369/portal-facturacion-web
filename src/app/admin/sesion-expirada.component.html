@if (visible) {
  <div class="ui-backdrop ui-backdrop--top">
    <div class="ui-dialog sesion-card" role="dialog" aria-modal="true" aria-labelledby="titulo-sesion">
      <form class="sesion-form" (ngSubmit)="continuar()" #f="ngForm">
        <div class="ui-dialog-body sesion-body">
          <img class="sesion-logo" src="assets/logo.png" alt="oso despierto" />
          <h2 id="titulo-sesion" class="sesion-titulo">Su sesión ha terminado</h2>
          <p class="sesion-msg">El tiempo de sesión ha expirado. Para continuar, ingrese su usuario y contraseña.</p>
          @if (usuarioLogueado) {
            <p class="sesion-msg sesion-usuario">Usuario conectado: <strong>{{ usuarioLogueado }}</strong></p>
          }

          <div class="formulario">
            <div class="campo">
              <label for="sesion-usuario">Usuario</label>
              <input id="sesion-usuario" class="ui-input" name="usuario" [(ngModel)]="usuario" placeholder="Ingresa tu usuario" autocomplete="username" />
            </div>
            <div class="campo">
              <label for="sesion-password">Contraseña</label>
              <div class="campo-password">
                <input id="sesion-password" class="ui-input" name="password" [(ngModel)]="password" [type]="mostrar ? 'text' : 'password'" placeholder="Ingresa tu contraseña" autocomplete="current-password" />
                <button type="button" class="ojo-btn" (click)="mostrar = !mostrar" [attr.aria-label]="mostrar ? 'Ocultar contraseña' : 'Mostrar contraseña'" [attr.aria-pressed]="mostrar">
                  @if (!mostrar) {
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
                  }
                  @if (mostrar) {
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7c1.9 0 3.6.4 5.1 1M22 12s-3.5 7-10 7c-1.9 0-3.6-.4-5.1-1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 3l18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                  }
                </button>
              </div>
            </div>

            @if (error) {
              <p class="error" role="alert">{{ error }}</p>
            }
          </div>
        </div>

        <div class="ui-dialog-foot sesion-pie">
          <button type="button" class="ui-btn ui-btn--ghost" [disabled]="cargando" (click)="cerrarSesion()">Cerrar sesión</button>
          <button type="submit" class="ui-btn ui-btn--primary" [disabled]="cargando">{{ cargando ? 'Verificando…' : 'Continuar' }}</button>
        </div>
      </form>
    </div>
  </div>
}

@if (cargando) {
  <app-loading-overlay texto="Verificando…"></app-loading-overlay>
}
