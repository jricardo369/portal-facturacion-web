<main id="contenido" class="login-full">
  <img class="marca-flotante" src="assets/logo.png" alt="Oso Despierto" />
  <section class="login-card" aria-labelledby="titulo-login">
    <div class="login-media" aria-hidden="true">
      <img src="assets/img3.jpg" alt="" />
    </div>
    <div class="login-body">
      <h1 id="titulo-login" class="panel-titulo">Bienvenidos al administrador de portal facturación</h1>
      <p class="panel-sub">Acceso exclusivo para personal de Oso Despierto.</p>

      <form class="formulario una-columna" (ngSubmit)="entrar()" #f="ngForm">
        <div class="campo requerido">
          <label class="sr-only" for="usuario">Usuario</label>
          <input id="usuario" name="usuario" [(ngModel)]="usuario" placeholder="Usuario" autocomplete="username" />
        </div>
        <div class="campo requerido campo-password">
          <label class="sr-only" for="password">Contraseña</label>
          <input id="password" name="password" [(ngModel)]="password" [type]="mostrar ? 'text' : 'password'" placeholder="Contraseña" autocomplete="current-password" />
          <button type="button" class="ojo-btn" (click)="mostrar = !mostrar" [attr.aria-label]="mostrar ? 'Ocultar contraseña' : 'Mostrar contraseña'" [attr.aria-pressed]="mostrar">
            <svg *ngIf="!mostrar" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
            <svg *ngIf="mostrar" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7c1.9 0 3.6.4 5.1 1M22 12s-3.5 7-10 7c-1.9 0-3.6-.4-5.1-1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 3l18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
        </div>
        <p class="error" *ngIf="error" role="alert">{{ error }}</p>
        <div class="acciones">
          <button type="submit" class="btn btn-continuar" [disabled]="cargando">{{ cargando ? 'Entrando…' : 'Entrar' }}</button>
        </div>
      </form>
    </div>
  </section>
</main>

<app-loading-overlay *ngIf="cargando" texto="Entrando…"></app-loading-overlay>
