<main id="contenido" class="login-full">
  <section class="login-visual">
    <img class="login-img" src="assets/img3.jpg" alt="" />
    <span class="login-overlay" aria-hidden="true"></span>
    <a class="login-brand" routerLink="/" aria-label="Ir a la página de inicio">
      <img src="assets/logo.png" alt="" />
      <span>oso despierto</span>
    </a>
    <div class="login-quote">
      <p>Administra tus facturas y clientes en un solo lugar.</p>
    </div>
  </section>

  <section class="login-area">
    <div class="login-card">
      <span class="login-badge">Administración</span>
      <h1 id="titulo-login" class="login-title">Bienvenidos al administrador de portal facturación</h1>
      <p class="login-sub">Acceso exclusivo para personal de oso despierto.</p>

      <form class="formulario" (ngSubmit)="entrar()" #f="ngForm">
        <div class="campo">
          <label for="usuario">Usuario</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <circle cx="12" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
              <path d="M5 20c.7-3.6 3.4-5.8 7-5.8s6.3 2.2 7 5.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <input id="usuario" name="usuario" [(ngModel)]="usuario" placeholder="Ingresa tu usuario" autocomplete="username" />
          </div>
        </div>

        <div class="campo">
          <label for="password">Contraseña</label>
          <div class="input-wrap campo-password">
            <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <rect x="5" y="10" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
              <path d="M8.5 10V7.5a3.5 3.5 0 0 1 7 0V10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <input id="password" name="password" [(ngModel)]="password" [type]="mostrar ? 'text' : 'password'" placeholder="Ingresa tu contraseña" autocomplete="current-password" />
            <button type="button" class="ojo-btn" (click)="mostrar = !mostrar" [attr.aria-label]="mostrar ? 'Ocultar contraseña' : 'Mostrar contraseña'" [attr.aria-pressed]="mostrar">
              @if (!mostrar) {
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
              }
              @if (mostrar) {
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7c1.9 0 3.6.4 5.1 1M22 12s-3.5 7-10 7c-1.9 0-3.6-.4-5.1-1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 3l18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
              }
            </button>
          </div>
        </div>

        @if (error) {
          <p class="error" role="alert">{{ error }}</p>
        }

        <button type="submit" class="login-btn" [disabled]="cargando">
          <span>{{ cargando ? 'Entrando…' : 'Entrar' }}</span>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <p class="login-note">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 3l7 3v5.5c0 4.5-2.9 8.2-7 9.5-4.1-1.3-7-5-7-9.5V6Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
            <path d="m9 12 2 2 4-4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Sesión protegida · Uso exclusivo del personal autorizado
        </p>
      </form>
    </div>
  </section>
</main>

@if (cargando) {
  <app-loading-overlay texto="Entrando…"></app-loading-overlay>
}
